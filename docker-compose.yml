services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: holdfast-oracle
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: holdfast_dev
      APP_USER: holdfast
      APP_USER_PASSWORD: holdfast_dev
    volumes:
      - holdfast-oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    shm_size: 1g

volumes:
  holdfast-oracle-data:
